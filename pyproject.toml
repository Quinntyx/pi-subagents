[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-subagents"
version = "0.1.0"
description = "Spawn, monitor, and steer standalone pi instances in tmux windows via pi-sock"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_subagents"]
